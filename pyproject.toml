[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber-tui"
version = "0.1.0"
description = "TUI audio transcriber and summarizer — local Whisper transcription + LLM summarization with editable prompts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.0.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
transcriber = "transcriber.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["transcriber*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
